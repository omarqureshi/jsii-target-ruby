name: build-cdk

# Builds Ruby gems for the AWS CDK from *published npm artifacts* through
# stock jsii-pacmak with this plugin: naming arrives via the target-config
# overlay (config/cdk-targets.json), no aws-cdk fork or assembly rebuild
# involved. Produces the gems as workflow artifacts, gated by a naming-sync
# check and a synth smoke test; with publish=true, pushes them to the public
# gem feed (rubygems.omarqureshi.net) and re-verifies by installing from it.
#
# NO immutability yet, deliberately: same-version gems overwrite in the feed
# while the pipeline is being iterated on ("mess-around mode"). Consumers
# with exact-pinned Gemfile.locks will see checksum mismatches on overwrite;
# a publish-once guard (with a force escape hatch) comes once the output is
# trusted.

on:
  workflow_dispatch:
    inputs:
      aws-cdk-lib-version:
        description: aws-cdk-lib version to build (an npm dist-tag or exact version)
        default: latest
      publish:
        description: publish the built gems to the public feed
        type: boolean
        default: false

# Publishing runs must not overlap the docs workflow (shared bucket + index);
# non-publishing runs get a unique group so they don't serialize.
concurrency:
  group: ${{ inputs.publish && 'gem-publish' || format('build-cdk-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Bootstrap toolchain
        uses: ./.github/actions/bootstrap-toolchain

      - name: Install aws-cdk-lib@${{ inputs.aws-cdk-lib-version }} (published artifacts)
        id: install
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p cdk-build && cd cdk-build
          npm init -y > /dev/null
          npm install --save "aws-cdk-lib@${{ inputs.aws-cdk-lib-version }}" @jsii/runtime
          node -p "require('aws-cdk-lib/package.json').version" > VERSION
          echo "aws-cdk-lib $(cat VERSION)"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Naming-sync check (new submodules need a deliberate decision)
        run: node scripts/check-cdk-naming.js "${{ runner.temp }}/cdk-build/node_modules/aws-cdk-lib"

      # Shares the tablet with publish-docs: the translations are the same work,
      # and whichever workflow runs first pays for them.
      - name: Restore translation tablet
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rosetta-tablet
          key: rosetta-ruby-tablet-${{ steps.install.outputs.version }}-${{ hashFiles('src/**', 'config/cdk-targets.json') }}
          restore-keys: |
            rosetta-ruby-tablet-${{ steps.install.outputs.version }}-
            rosetta-ruby-tablet-

      - name: Extract Ruby translations
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/cdk-targets.json
          # Rosetta defaults to half the cores as workers; measured at ~3GB
          # each, which overruns a 16GB runner. Cap it: the extract is bounded
          # by memory here, not by cores.
          JSII_ROSETTA_MAX_WORKER_COUNT: '3'
        run: |
          cache_dir="${{ runner.temp }}/rosetta-tablet"
          mkdir -p "$cache_dir"
          cached="$cache_dir/ruby.tabl.json"
          node --max-old-space-size=8192 scripts/extract-tablet.js \
            "${{ runner.temp }}/cdk-build/node_modules/aws-cdk-lib" \
            "$cache_dir/next.tabl.json" \
            $([ -f "$cached" ] && echo "$cached")
          mv "$cache_dir/next.tabl.json" "$cached"
          echo "TABLET=$cached" >> "$GITHUB_ENV"

      - name: Generate and build gems (single --recurse over the installed closure)
        env:
          JSII_RUBY_TARGET_CONFIG: ${{ github.workspace }}/config/cdk-targets.json
          # The feed publishes the closure atomically: every inter-gem
          # dependency is pinned to the exact version generated together.
          JSII_RUBY_PIN_DEPENDENCIES: exact
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          # One --recurse run: this is the invocation every scaffolded plugin
          # pipeline should be able to use — no closure-ordering machinery of
          # its own. It exercises the D1 branch's pacmak fix (build order
          # ignores devDependencies; the published @aws-cdk/asset-* packages
          # devDepend on aws-cdk-lib, which used to deadlock the sort here),
          # so a regression fails this step before anything generates.
          # --rosetta-unknown-snippets=translate: without it rosetta returns
          # snippets verbatim while still labelling the fence with the target
          # language, so docs would claim Ruby and show TypeScript.
          node --max-old-space-size=8192 toolchain/jsii/packages/jsii-pacmak/bin/jsii-pacmak \
            --plugin "$(pwd)" \
            -t ruby --force-target --recurse \
            --rosetta-tablet "$TABLET" \
            --rosetta-unknown-snippets=translate \
            -o "${workdir}/dist" "${workdir}/node_modules/aws-cdk-lib"
          (cd runtime && gem build jsii-ruby-runtime.gemspec && mv jsii-ruby-runtime-*.gem "${workdir}/dist/ruby/")
          ls -la "${workdir}/dist/ruby/"*.gem

      - name: Syntax-check every generated file
        run: |
          cd "${{ runner.temp }}/cdk-build/dist/ruby/lib"
          count=$(find . -name '*.rb' | wc -l)
          find . -name '*.rb' -print0 | xargs -0 -P "$(nproc)" -n 200 ruby -c > /dev/null
          echo "ruby -c: ${count} files clean"

      - name: Synth smoke test
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          export GEM_HOME="${workdir}/gemhome"
          (cd "${workdir}/dist/ruby" && gem install --local --no-document ./*.gem)
          JSII_RUNTIME="${workdir}/node_modules/@jsii/runtime/bin/jsii-runtime" \
            ruby scripts/synth-smoke.rb

      - name: Upload gems
        uses: actions/upload-artifact@v4
        with:
          name: cdk-ruby-gems-${{ inputs.aws-cdk-lib-version }}
          path: ${{ runner.temp }}/cdk-build/dist/ruby/*.gem
          if-no-files-found: error

      - name: Configure AWS Credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Publish gems to the public feed
        if: inputs.publish
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          BUCKET=aws-cdk-ruby-gems
          REPO_DIR="${{ runner.temp }}/gem-repo"
          mkdir -p "$REPO_DIR/gems"

          # Pull the existing gems down so the regenerated index retains
          # prior versions. Same-name gems from this run OVERWRITE (see the
          # header note on mess-around mode).
          aws s3 sync "s3://$BUCKET/gems/" "$REPO_DIR/gems/" --no-progress
          cp -f "${workdir}/dist/ruby/"*.gem "$REPO_DIR/gems/"
          echo "Total gems in repository: $(ls "$REPO_DIR/gems" | wc -l)"

          # generate_index (legacy static index) is a plugin in modern RubyGems.
          gem install rubygems-generate_index --no-document
          gem generate_index --directory "$REPO_DIR"

          # Reconciliation guard: every gem built this run must appear in the
          # regenerated index — fail before uploading anything.
          ruby -rzlib -rstringio -e '
            specs = %w[specs.4.8.gz prerelease_specs.4.8.gz].flat_map { |f|
              path = File.join("'"$REPO_DIR"'", f)
              File.exist?(path) ? Marshal.load(Zlib::GzipReader.new(StringIO.new(File.binread(path))).read) : []
            }
            indexed = specs.map { |name, version, _| "#{name}-#{version}" }
            built = Dir.glob("'"$workdir"'/dist/ruby/*.gem").map { |f| File.basename(f, ".gem") }
            missing = built.reject { |g| indexed.include?(g) }
            abort("::error::gems built this run but absent from the regenerated index: #{missing.join(", ")}") unless missing.empty?
            puts "index OK: all #{built.size} freshly built gems present"
          '

          # Provenance manifest beside the index: what was built, from what.
          mkdir -p "$REPO_DIR/manifests"
          cdk_version=$(basename "${workdir}"/dist/ruby/aws-cdk-lib-*.gem .gem | sed 's/^aws-cdk-lib-//')
          cat > "$REPO_DIR/manifests/aws-cdk-lib-${cdk_version}.json" << MANIFEST
          {
            "aws_cdk_lib": "${cdk_version}",
            "plugin": "${{ github.sha }}",
            "jsii": "$(git -C toolchain/jsii rev-parse HEAD)",
            "jsii_rosetta": "$(git -C toolchain/jsii-rosetta rev-parse HEAD)",
            "workflow_run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "built_at": "$(date -u +%FT%TZ)"
          }
          MANIFEST

          # Human-facing landing for the feed root, from the fresh index.
          ruby docs-gen/gen-feed-index.rb "$REPO_DIR"

          aws s3 sync "$REPO_DIR/" "s3://$BUCKET/" --no-progress

          # Shared site stylesheets at the canonical /styles/ path.
          aws s3 sync docs-gen "s3://$BUCKET/styles/" \
            --exclude "*" --include "*.css" --content-type "text/css" --no-progress

          # Spot-check: the freshly built gems must actually be in the bucket.
          for gem_file in "${workdir}/dist/ruby/"*.gem; do
            key="gems/$(basename "$gem_file")"
            aws s3api head-object --bucket "$BUCKET" --key "$key" >/dev/null \
              || { echo "::error::$key missing from s3://$BUCKET after sync"; exit 1; }
          done

          # Consumers must see the fresh index immediately; a missing
          # distribution means silent staleness, so fail loudly.
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, 'rubygems.omarqureshi.net')].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::error::no CloudFront distribution found for rubygems.omarqureshi.net"
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' >/dev/null
          echo "published + invalidated on $DIST_ID"

      - name: Verify by installing from the public feed
        if: inputs.publish
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          verify="${{ runner.temp }}/feed-verify"
          mkdir -p "$verify" && cd "$verify"
          cdk_version=$(basename "${workdir}"/dist/ruby/aws-cdk-lib-*.gem .gem | sed 's/^aws-cdk-lib-//')
          cat > Gemfile << GEMFILE
          source 'https://rubygems.omarqureshi.net'
          gem 'aws-cdk-lib', '= ${cdk_version}'
          GEMFILE
          bundle install
          JSII_RUNTIME="${workdir}/node_modules/@jsii/runtime/bin/jsii-runtime" \
            bundle exec ruby "${GITHUB_WORKSPACE}/scripts/synth-smoke.rb"

      - name: Summary
        run: |
          workdir="${{ runner.temp }}/cdk-build"
          {
            echo "## CDK Ruby gems — built from published npm artifacts via \`--plugin\`"
            echo
            echo "| gem | size |"
            echo "| --- | --- |"
            for gem in "${workdir}/dist/ruby/"*.gem; do
              echo "| $(basename "$gem") | $(du -h "$gem" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
