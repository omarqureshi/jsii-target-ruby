name: Bootstrap jsii toolchain
description: >
  Checks out and builds the jsii toolchain branches that carry the pacmak
  plugin API (unreleased), then links this plugin against them. Every step
  mirrors a locally validated sequence; when the plugin API ships in released
  packages this action collapses to `npm install`.

inputs:
  jsii-repo:
    description: jsii monorepo (owner/repo)
    default: omarqureshi/jsii
  jsii-ref:
    description: jsii branch with the pacmak plugin API
    default: jsii-language-plugins
  rosetta-repo:
    description: jsii-rosetta repo (owner/repo)
    default: omarqureshi/jsii-rosetta
  rosetta-ref:
    description: jsii-rosetta branch with the language registry + corpus
    default: jsii-language-plugins
  build-jsii-calc:
    description: also build the jsii-calc fixture chain (needed by the compliance suite)
    default: 'false'
  install-runtime:
    description: >
      Install @jsii/runtime and export JSII_RUNTIME, for steps that start a
      kernel (running generated bindings, rather than only generating them).
      The published runtime is used deliberately: a guest runtime is supposed
      to work against a released kernel, so testing against the fork's would
      prove less.
    default: 'false'
  plugin-path:
    description: >
      Where the jsii-target-ruby checkout is, relative to the workspace. Defaults
      to the repository itself; a distribution repository (aws-cdk-ruby, cdk8s-ruby)
      checks the plugin out alongside its own sources and points this at it, so the
      toolchain wiring lives in one place rather than being copied per repository.
    default: '.'

runs:
  using: composite
  steps:
    - name: Checkout jsii (${{ inputs.jsii-ref }})
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.jsii-repo }}
        ref: ${{ inputs.jsii-ref }}
        path: toolchain/jsii

    - name: Checkout jsii-rosetta (${{ inputs.rosetta-ref }})
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.rosetta-repo }}
        ref: ${{ inputs.rosetta-ref }}
        path: toolchain/jsii-rosetta

    - name: Enable corepack (yarn 4)
      shell: bash
      run: corepack enable

    - name: Build jsii-pacmak and its workspace dependencies
      shell: bash
      working-directory: toolchain/jsii
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      run: |
        yarn install
        yarn workspace @jsii/spec run build
        cd packages/jsii-pacmak
        yarn gen
        npx tsc --build
        chmod +x bin/jsii-pacmak

    - name: Build jsii-calc fixture chain
      if: inputs.build-jsii-calc == 'true'
      shell: bash
      working-directory: toolchain/jsii
      run: npx lerna run build --scope jsii-calc --include-dependencies --stream

    - name: Build jsii-rosetta
      shell: bash
      working-directory: toolchain/jsii-rosetta
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      run: |
        yarn install
        npx projen compile

    - name: Install @jsii/runtime for the kernel
      if: inputs.install-runtime == 'true'
      shell: bash
      run: |
        dir="${RUNNER_TEMP}/jsii-runtime"
        mkdir -p "$dir"
        ( cd "$dir" && npm init -y > /dev/null && npm install @jsii/runtime > /dev/null )
        bin="$dir/node_modules/.bin/jsii-runtime"
        [ -x "$bin" ] || { echo "::error::@jsii/runtime installed but $bin is not executable"; exit 1; }
        echo "JSII_RUNTIME=$bin" >> "$GITHUB_ENV"
        echo "kernel: $bin"

    - name: Link plugin against the toolchain and build it
      shell: bash
      working-directory: ${{ inputs.plugin-path }}
      run: |
        # link-toolchain also repoints the MONOREPO's jsii-rosetta at the
        # checkout: jsii-pacmak resolves rosetta from there, and the published
        # copy has no language registry — so without this the plugin registers
        # its visitor into a copy nobody reads and every example silently stays
        # TypeScript.
        # Paths are workspace-relative; from a nested plugin checkout the
        # toolchain still sits at the workspace root.
        root="$(cd "${GITHUB_WORKSPACE}" && pwd)"
        ./scripts/link-toolchain.sh "$root/toolchain/jsii" "$root/toolchain/jsii-rosetta"
        npm run build

    - name: Verify pacmak and the plugin share one jsii-rosetta
      shell: bash
      run: |
        pacmak_rosetta="$(node -p "require.resolve('jsii-rosetta/package.json', { paths: ['toolchain/jsii/packages/jsii-pacmak'] })")"
        plugin_rosetta="$(node -p "require.resolve('jsii-rosetta/package.json', { paths: ['${{ inputs.plugin-path }}'] })")"
        if [ "$(realpath "$pacmak_rosetta")" != "$(realpath "$plugin_rosetta")" ]; then
          echo "::error::pacmak resolves $pacmak_rosetta but the plugin resolves $plugin_rosetta"
          echo "Example translation would silently emit TypeScript. See scripts/link-toolchain.sh."
          exit 1
        fi
        node -e "
          const r = require.resolve('jsii-rosetta/lib/languages/index', { paths: ['${{ inputs.plugin-path }}'] });
          if (typeof require(r).registerTargetLanguage !== 'function') {
            console.error('::error::resolved jsii-rosetta has no language registry');
            process.exit(1);
          }
        "
        echo "pacmak and plugin share $(realpath "$plugin_rosetta")"
